name: image

# A preview of the cloud machine's image for a branch, by hand: gh workflow run image.yml --ref <branch>.
# Releases don't need it: release.yml builds the image itself, around the released binary, when
# what the image runs (container/image.inputs) has changed. This builds the same way
# (.github/actions/cloud-image), around a checkout's linux-x64 build, and prints the lines that pin
# it in container/image.digest, the image `pnpm compile` puts in a checkout's build (a local
# `ky deploy`, deploy.yml). Its runs on main also warm the layer cache tag runs read.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: pnpm install --frozen-lockfile
      - name: Build ky for linux-x64
        run: pnpm compile linux-x64
      - name: Build the image
        id: image
        uses: ./.github/actions/cloud-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          source: ${{ github.sha }}
      - name: Say how to pin it
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          {
            echo
            echo "To have a checkout build with it, put these last in container/image.digest:"
            echo
            echo '```'
            echo "# source: $GITHUB_SHA"
            echo "$REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
