name: image

# Publishes the cloud machine's image (container/Dockerfile) to GitHub's registry and records its
# linux/amd64 digest. `ky deploy` copies the ref in container/image.digest into the account's
# registry.cloudflare.com (cli/image.ts). The package must be public: deploys pull it anonymously.
on:
  push:
    branches: [main]
    paths:
      - container/Dockerfile
      - cli/**
      - src/runner-protocol.ts
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Build ky for linux-x64
        run: pnpm compile linux-x64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub's registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ky-cloud"
          tag="$repository:$GITHUB_SHA"
          docker buildx build \
            --platform linux/amd64 \
            --file container/Dockerfile \
            --tag "$tag" \
            --provenance=false \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            --push .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          case "$digest" in sha256:*) ;; *) echo "no digest in build metadata" >&2; exit 1 ;; esac
          {
            echo "### Cloud machine image"
            echo
            echo "- tag: \`$tag\`"
            echo "- ref: \`$repository@$digest\`"
            echo
            echo "To deploy it, put the ref in \`container/image.digest\` and commit."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
